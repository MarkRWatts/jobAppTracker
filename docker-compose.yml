services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobapptracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobapptracker}
    ports:
      # Host port 5433, not 5432 — this machine already runs a Homebrew
      # Postgres on 5432 for the re:Fresh project.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobapptracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobapptracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobapptracker}?schema=public
      # Auth.js — Sign in with Google (see .env.docker.example).
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID in .env.docker}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET in .env.docker}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.docker}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env.docker}
    ports:
      # Host port 3001 — re:Fresh's own container already publishes 3000.
      - "3001:3000"
    volumes:
      # Uploaded CVs/cover letters/etc — see src/lib/attachments/storage.ts.
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
